<style>
body{margin:0;background:#F4EDE0}
.fa{position:relative;display:flex;height:100vh;min-height:560px;overflow:hidden;background:#F4EDE0;color:#001B5E;font-family:Montserrat,Arial,sans-serif;box-sizing:border-box}
*{box-sizing:border-box}
button:focus-visible,a:focus-visible{outline:3px solid #003DAF;outline-offset:3px}
.stripe{flex:none;width:28px;display:flex;flex-direction:column}
.col{flex:1;min-width:0;display:flex;flex-direction:column;padding:clamp(20px,4.4vh,44px) clamp(24px,5vw,72px) clamp(14px,3vh,30px)}
.inner{flex:1;min-height:0;display:flex;flex-direction:column;width:100%;max-width:1200px;margin:0 auto}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
.tag{justify-self:start;background:#F2B134;color:#001B5E;font-weight:800;font-size:14px;letter-spacing:.12em;text-transform:uppercase;padding:6px 12px;line-height:1.3}
.switch{display:flex;border:2px solid #001B5E}
.switch button{appearance:none;border:0;border-radius:0;height:40px;min-width:48px;padding:0 12px;font-family:Montserrat,Arial,sans-serif;font-weight:800;font-size:13px;letter-spacing:.1em;cursor:pointer}
.seal{justify-self:end;width:56px;height:56px;display:block}
.stage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);gap:clamp(32px,5vw,72px);align-items:center}
.symbol{display:block;width:100%;max-width:460px;height:auto;aspect-ratio:610/477}
h1{margin:0;font-family:'Londrina Solid',Impact,sans-serif;font-weight:900;text-transform:uppercase;line-height:.94;letter-spacing:.005em;font-size:min(7.2vw,11.4vh);filter:url(#fa-carve)}
.count{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:clamp(20px,4.6vh,44px);border-top:3px solid #001B5E;max-width:620px}
.cell{padding:clamp(10px,1.8vh,16px) 16px 0;border-left:2px solid #E0D2B8}
.cell.first{padding-left:0;border-left:0}
.num{display:block;font-family:'Londrina Solid',Impact,sans-serif;font-weight:900;font-size:min(5.4vw,9.4vh);line-height:1;color:#001B5E;filter:url(#fa-carve-s)}
.lab{display:block;margin-top:6px;font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#94491F}
.foot{padding-top:clamp(6px,1.4vh,16px)}
.handle{display:inline-block;padding:10px 0;font-family:'Londrina Solid',Impact,sans-serif;font-weight:900;font-size:28px;letter-spacing:.04em;text-transform:uppercase;text-decoration:none;color:#94491F}
.handle:hover{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px}
@media (max-width:900px){
  .stage{grid-template-columns:minmax(0,1fr);align-content:center;justify-items:start;gap:clamp(14px,2.6vh,28px)}
  .symbol{width:auto;height:min(25vh,230px);max-width:100%}
  h1{font-size:min(10vw,7.2vh)}
  .num{font-size:min(8vw,7vh)}
}
@media (max-width:620px){
  .stripe{width:14px}
  .col{padding-left:22px;padding-right:20px}
  .top{grid-template-columns:1fr auto;row-gap:14px}
  .switch{grid-row:2;grid-column:1 / -1;justify-self:start}
  .seal{width:48px;height:48px}
  h1{font-size:min(11.4vw,6.4vh)}
  .cell{padding-left:10px;padding-right:6px}
  .num{font-size:min(11vw,6.4vh)}
  .lab{font-size:10px;letter-spacing:.06em}
  .handle{font-size:26px}
}

.switch button.on{background:#001B5E;color:#F4EDE0}
.switch button{background:transparent;color:#001B5E}
.switch button+button{border-left:2px solid #001B5E}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
(function () {
  var TARGET = new Date('2027-02-02T19:00:00-05:00').getTime();
  var COPY = {
    en: { html: 'en', a: 'Something new is coming', b: 'to Boston.', labels: ['DAYS', 'HOURS', 'MINUTES', 'SECONDS'] },
    pt: { html: 'pt-BR', a: 'Algo novo está chegando', b: 'a Boston.', labels: ['DIAS', 'HORAS', 'MINUTOS', 'SEGUNDOS'] },
    es: { html: 'es', a: 'Algo nuevo está llegando', b: 'a Boston.', labels: ['DÍAS', 'HORAS', 'MINUTOS', 'SEGUNDOS'] }
  };
  var $ = function (id) { return document.getElementById(id); };
  var pad = function (n) { return String(n).padStart(2, '0'); };
  function tick() {
    var diff = Math.max(0, TARGET - Date.now());
    var d = Math.floor(diff / 864e5); diff -= d * 864e5;
    var h = Math.floor(diff / 36e5); diff -= h * 36e5;
    var m = Math.floor(diff / 6e4); diff -= m * 6e4;
    var s = Math.floor(diff / 1000);
    $('n-d').textContent = pad(d); $('n-h').textContent = pad(h);
    $('n-m').textContent = pad(m); $('n-s').textContent = pad(s);
  }
  function setLang(code) {
    var c = COPY[code] || COPY.en;
    document.documentElement.lang = c.html;
    $('headline').lang = c.html;
    $('h-a').textContent = c.a; $('h-b').textContent = c.b;
    ['d', 'h', 'm', 's'].forEach(function (k, i) { $('l-' + k).textContent = c.labels[i]; });
    document.querySelectorAll('.switch button').forEach(function (b) {
      var on = b.getAttribute('data-lang') === code;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }
  document.querySelectorAll('.switch button').forEach(function (b) {
    b.addEventListener('click', function () { setLang(b.getAttribute('data-lang')); });
  });
  tick(); setInterval(tick, 1000);
})();
</script>
